server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: AUDIT_CSRF_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

spring:
  application:
    name: admin-audit-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditdb}
    username: ${DB_USERNAME:audit}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO

audit:
  cookie-secure: ${COOKIE_SECURE:true}
